<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DayMelo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0c1229;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .phone-container {
            width: 100%;
            max-width: 414px;
            height: 100%;
            max-height: 896px;
            background: linear-gradient(135deg, #0c1229 0%, #1a2352 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            pointer-events: none;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 75px);
            display: none;
            flex-direction: column;
            padding: 24px 20px;
            overflow-y: auto;
            z-index: 1;
        }
        .screen.active {
            display: flex;
        }
        #screen1 {
            justify-content: center;
            align-items: center;
            height: 100%;
        }
        .logo-circle {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: #e6e1fc;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(230, 225, 252, 0.3);
            cursor: pointer;
            overflow: hidden;
            border: 3px solid #000;
        }
        .screen-title {
            font-size: 32px;
            font-weight: 400;
            color: #ffffff;
            margin-bottom: 15px;
            text-align: left;
        }
        .card-box {
            background: rgba(140, 140, 190, 0.25);
            border-radius: 20px;
            padding: 14px;
            margin-bottom: 12px;
            backdrop-filter: blur(10px);
        }
        .card-label {
            font-size: 14px;
            color: #d1d5db;
            margin-bottom: 6px;
        }
        .options-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .option-item {
            font-size: 32px;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: 0.2s;
            border: 2px solid transparent;
            user-select: none;
        }
        .option-item.selected {
            background: rgba(255, 255, 255, 0.2);
            border-color: #ffffff;
            transform: scale(1.1);
        }
        .bul-btn {
            background: rgba(140, 140, 190, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 35px;
            padding: 12px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            margin-top: 5px;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            user-select: none;
        }
        .bul-btn:active {
            transform: scale(0.97);
        }
        .song-card-box {
            background: rgba(140, 140, 190, 0.25);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
            backdrop-filter: blur(10px);
        }
        .album-art {
            width: 210px;
            height: 210px;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            background-color: #1a2352;
        }
        .song-info-box {
            background: rgba(100, 100, 140, 0.4);
            border-radius: 14px;
            padding: 12px 15px;
            text-align: center;
            width: 100%;
            font-size: 16px;
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.1);
            font-weight: 500;
        }
        /* Platform Butonları */
        .platform-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }
        .platform-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 18px;
            transition: 0.2s;
            text-decoration: none;
        }
        .platform-btn:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.3);
        }
        .history-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            max-height: calc(100% - 60px);
            padding-bottom: 20px;
        }
        .history-item {
            background: rgba(140, 140, 190, 0.25);
            border-radius: 18px;
            padding: 12px;
            display: flex;
            align-items: center;
            backdrop-filter: blur(10px);
            gap: 15px;
            min-height: 85px;
        }
        .history-thumb {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            background-color: #1a2352;
        }
        .history-text {
            font-size: 15px;
            color: #ffffff;
            font-weight: 500;
            word-break: break-word;
        }
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background: rgba(20, 25, 50, 0.95);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }
        .nav-icon {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 26px;
            color: #9ca3af;
            transition: 0.2s;
            padding: 10px;
        }
        .nav-icon.active {
            color: #ffffff;
            transform: scale(1.1);
        }
    </style>
</head>

                <span class="option-item" onclick="selectOption('weather', '❄️', this)">❄️</span>
            </div>
        </div>

        <div class="card-box">
            <div class="card-label">Hangi Aktiviteyi Yapıyorsun</div>
            <div class="options-row">
                <span class="option-item selected" onclick="selectOption('activity', '📖', this)">📖</span>
                <span class="option-item" onclick="selectOption('activity', '🌙', this)">🌙</span>
                <span class="option-item" onclick="selectOption('activity', '🏋️', this)">🏋️</span>
            </div>
        </div>

        <div class="bul-btn" onclick="generateSong()">BUL</div>
    </div>

        </div>

            <!-- Her şarkıya özel dinamik platform bağlantıları -->
            <div class="platform-row">

            </div>
        </div>
    </div>

    <div id="screen4" class="screen">

    </div>

    ];

    function selectOption(category, value, element) {
        const parent = element.parentElement;
        parent.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
        
        if(category === 'mood') selectedMood = value;
        if(category === 'weather') selectedWeather = value;
        if(category === 'activity') selectedActivity = value;
    }

    function goToScreen(screenNumber) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen' + screenNumber).classList.add('active');

        const nav = document.getElementById('bottomNav');
        if(screenNumber === 1) {
            nav.style.display = 'none';
        } else {
            nav.style.display = 'flex';
        }

        document.querySelectorAll('.nav-icon').forEach(btn => btn.classList.remove('active'));
        if(screenNumber === 2) document.getElementById('navHome').classList.add('active');
        if(screenNumber === 3) document.getElementById('navPlay').classList.add('active');
        if(screenNumber === 4) {
            document.getElementById('navHistory').classList.add('active');
            renderHistory();
        }
    }

    function generateSong() {
        const key = `${selectedMood}-${selectedWeather}-${selectedActivity}`;
        const song = songDatabase[key] || { 
            title: "Radiohead - Creep", 
            img: "https://i.scdn.co/image/ab67616d0000b273ba5db46f4b838ef6027e6f96",
            spotify: "https://open.spotify.com/search/Radiohead%20Creep",
            youtube: "https://music.youtube.com/search?q=Radiohead+Creep",
            apple: "https://music.apple.com/us/search?term=Radiohead%20Creep"
        };

        document.getElementById('resultImage').src = song.img;
        document.getElementById('resultText').innerText = song.title;

        // Platform linklerini ilgili şarkıya göre güncelle
        document.getElementById('spotifyLink').href = song.spotify;
        document.getElementById('youtubeLink').href = song.youtube;
        document.getElementById('appleLink').href = song.apple;

        historyData.unshift(song);
        if(historyData.length > 10) historyData.pop();
        localStorage.setItem('daymelo_history', JSON.stringify(historyData));

        goToScreen(3);
    }

    function renderHistory() {
        const container = document.getElementById('historyList');
        container.innerHTML = '';
        historyData.forEach(item => {
            container.innerHTML += `
                <div class="history-item">
                    <img class="history-thumb" src="${item.img}" alt="Cover">
                    <div class="history-text">${item.title}</div>
                </div>
            `;
        });
    }
